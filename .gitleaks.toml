condition = "AND"
regexTarget = "secret"
regexes = ['''^(?:cb065870477e89f17856f64a5eb8fa204e7ffd59c227be102374b7bd65a153da)$''']
paths = ['''(^|/)docs/evidence/history/browser\-53d9ce7\.json$''']

[[rules.allowlists]]
